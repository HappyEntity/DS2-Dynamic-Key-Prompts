; Dynamic Key Prompts — shows the keys you actually bound instead of gamepad buttons in prompts.

[General]
; 0 = the mod does nothing
Enabled=1
; 1 = detailed DynamicKeyPrompts.log; F9 in game writes your current bindings to it
Diagnostics=0

; icons - key / mouse icons drawn into the game font (the game's own font files are not modified:
;         a patched copy is kept in DynamicKeyPrompts\cache and rebuilt when needed)
; text  - key names as text, e.g. [E]
Style=icons

; Icon theme = sprite sheet DynamicKeyPrompts\icons\<IconTheme>.png plus <IconTheme>.txt (icon rectangles).
; Built-in: dark (stone plate, bronze rim), minimal (frame only), silver (like the game's RB/LT icons).
; Their sheets are written on first start and can be edited. For your own theme copy e.g.
; dark.png + dark.txt to mytheme.png + mytheme.txt and set IconTheme=mytheme.
IconTheme=dark

; Which binding to show when an action has both a key and a mouse button:
;   auto     - a plain mouse button if there is one (attack = LMB, lock-on = MMB), otherwise the key;
;              the camera stick is shown as the mouse
;   keyboard - always the keyboard key (camera = IJKL)
;   mouse    - the mouse button whenever there is one (also Shift+LMB etc.)
;   both     - key and mouse button, e.g. H/LMB
Labels=auto

; ---- text style only
; How a key is shown. {0} is the key name, e.g. "[{0}]" -> [E]
Format=[{0}]
; Between keys of a stick / d-pad prompt when the names are longer than one letter (W/A/S/D)
Separator=/
; 1 = short key names (LMB, Shift, PgUp); 0 = full names as in the game's Key Bindings screen
ShortNames=1
; Optional colour of the key label, RRGGBB (e.g. E0C080). Empty = normal text colour.
Color=

[Bindings]
; Replace the label of a game input with your own text. Input ids:
;   0 switch spells    1 switch items     2 switch left weapon   3 switch right weapon
;   4 start menu       5 gestures         6 attack (L)           7 attack (R)
;   8 strong attack(L) 9 strong attack(R) 10 jump                11 lock on / reset camera
;   12 interact        13 roll / dash     14 use item            15 two-hand
;   16 confirm         17 cancel          33-36 menu cursor up/down/left/right
;   37/38 menu tab left/right             39/40 function 1/2
; Example:
; 12=E
